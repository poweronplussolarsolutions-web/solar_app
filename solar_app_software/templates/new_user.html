{% extends "base.html" %}
{% block title %}New User — Admin{% endblock %}
{% block page_title %}New User{% endblock %}
{% block topbar_actions %}
  <a href="{{ url_for('manage_users') }}" class="btn btn-sm">← Back</a>
{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;width:100%;box-sizing:border-box">
  <form method="POST" action="{{ url_for('new_user') }}">
    <div class="form-group">
      <label>Full name</label>
      <input name="full_name" type="text" required placeholder="Full name"/>
    </div>
    <div class="form-group">
      <label>Username</label>
      <input name="username" type="text" required placeholder="username (no spaces)"/>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input name="email" type="email" required placeholder="email@poweronplus.in"/>
    </div>
    <div class="form-group">
      <label>Role</label>
      <select name="role" required>
        <option value="">Select role</option>
        <option value="admin">Admin</option>
        <option value="coordinator">Coordinator</option>
        <option value="documents">Documents Team</option>
        <option value="payments">Payments Team</option>
        <option value="onsite">On-site Management</option>
        <option value="appinstall">App Installation Team</option>
      </select>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input name="password" type="password" required placeholder="Set password"/>
    </div>
    <div style="display:flex;gap:10px;margin-top:8px;flex-wrap:wrap">
      <button type="submit" class="btn btn-primary" style="flex:1;min-width:120px;justify-content:center">
        Create user
      </button>
      <a href="{{ url_for('manage_users') }}" class="btn" style="flex:1;min-width:100px;text-align:center">
        Cancel
      </a>
    </div>
  </form>
</div>
{% endblock %}
