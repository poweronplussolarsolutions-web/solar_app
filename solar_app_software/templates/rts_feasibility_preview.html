{% extends "base.html" %}
{% block title %}RTS Feasibility Preview — {{ proj.project_code }}{% endblock %}
{% block page_title %}RTS Vendor Feasibility — {{ proj.project_code }} — Preview{% endblock %}

{% block content %}
<div class="card">
  <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
    <a class="btn btn-primary btn-sm" href="{{ url_for('rts_feasibility_file', pid=proj.id, download=1) }}">
      ⬇ Download PDF
    </a>
    <button type="button" class="btn btn-sm" onclick="printRtsPdf()">🖶 Print</button>
    <a class="btn btn-sm" href="{{ url_for('rts_feasibility_form', pid=proj.id) }}">← Edit details</a>
  </div>

  <iframe id="rtsPdfFrame"
          src="{{ url_for('rts_feasibility_file', pid=proj.id) }}"
          style="width:100%;height:82vh;border:1px solid var(--border);border-radius:var(--radius)">
  </iframe>
</div>

<script>
function printRtsPdf() {
  var frame = document.getElementById('rtsPdfFrame');
  try {
    frame.contentWindow.focus();
    frame.contentWindow.print();
  } catch (e) {
    // Fallback for browsers that block printing an embedded cross-context PDF —
    // open it in a new tab where the browser's own PDF viewer print icon works.
    window.open(frame.src, '_blank');
  }
}
</script>
{% endblock %}
