{% extends "base.html" %}
{% block title %}New Project — Solar App{% endblock %}
{% block page_title %}New Project{% endblock %}

{% block content %}
<div class="card" style="max-width:720px">
  <form method="POST" action="{{ url_for('new_project') }}">
    <div style="font-size:13px;font-weight:500;margin-bottom:14px;color:var(--muted)">Customer details</div>
    <!-- <div class="form-grid">
      <div class="form-group full">
        <label>Existing customer</label>
        <select name="customer_id" id="cust_select" onchange="toggleNew(this.value)">
          <option value="">— New customer —</option>
          {% for c in customers %}
          <option value="{{ c.id }}">{{ c.name }} ({{ c.phone }})</option>
          {% endfor %}
        </select>
      </div>
    </div> -->

    <div id="new-cust-fields">
      <div class="form-grid">
        <div class="form-group">
          <label>Customer name *</label>
          <input name="customer_name" type="text" placeholder="Full name"/>
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input name="phone" type="tel" placeholder="9876543210"/>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input name="email" type="email" placeholder="customer@email.com"/>
        </div>
        <div class="form-group">
          <label>District</label>
          <select name="district">
            <option value="">Select district</option>
            {% for d in ['Thiruvananthapuram','Kollam','Pathanamthitta','Alappuzha','Kottayam','Idukki','Ernakulam','Thrissur','Palakkad','Malappuram','Kozhikode','Wayanad','Kannur','Kasaragod'] %}
            <option>{{ d }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Pincode</label>
          <input name="pincode" type="text" maxlength="6" placeholder="680001"/>
        </div>
        <div class="form-group">
          <label></label>
        </div>
        <div class="form-group full">
          <label>Address</label>
          <textarea name="address" rows="2" placeholder="Full address"></textarea>
        </div>
      </div>
    </div>

    <div style="border-top:0.5px solid var(--border);margin:16px 0 14px;font-size:13px;font-weight:500;padding-top:14px;color:var(--muted)">
      Project details
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>Inverter capacity (kW) *</label>
        <input name="inverter_capacity_kw" type="number" step="0.5" min="1" required placeholder="e.g. 5"/>
      </div>
      <div class="form-group">
        <label>Panel capacity (kW) *</label>
        <input name="panel_capacity_kw" type="number" step="0.5" min="1" required placeholder="e.g. 6"/>
      </div>
      <div class="form-group">
        <label>Project type *</label>
        <select name="project_type" required>
          <option value="Cash">Cash</option>
          <option value="Loan">Loan</option>
        </select>
      </div>
      <div class="form-group">
        <label>Project subtype</label>
        <select name="project_subtype">
          <option value="DCR">DCR (with subsidy)</option>
          <option value="Non-DCR">Non-DCR (no subsidy)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Total contract amount (₹)</label>
        <input name="total_amount" type="number" step="1" min="0" placeholder="0"/>
      </div>
      
      <div class="form-group">
        <label>Coordinator</label>
        <input type="text" value="{{ current_user.full_name }}" disabled
         style="background:var(--bg);color:var(--muted);cursor:not-allowed"/>
        <span style="font-size:11px;color:var(--hint);margin-top:3px;display:block">
          Auto-assigned to you
        </span>
      </div>
      <div class="form-group">
        <label>Documents staff</label>
        <select name="doc_staff_id">
          <option value="">— Assign staff —</option>
          {% for u in doc_staff %}
          <option value="{{ u.id }}">{{ u.full_name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group full">
        <label>Notes</label>
        <textarea name="notes" rows="2" placeholder="Any additional notes…"></textarea>
      </div>
    </div>

    <div style="display:flex;gap:10px;margin-top:8px">
      <button type="submit" class="btn btn-primary">Create project</button>
      <a href="{{ url_for('projects') }}" class="btn">Cancel</a>
    </div>
  </form>
</div>

<script>
function toggleNew(val) {
  document.getElementById('new-cust-fields').style.display = val ? 'none' : 'block';
}
</script>
{% endblock %}
