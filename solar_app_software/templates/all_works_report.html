{% extends "base.html" %}
{% block title %}All Works{% endblock %}
{% block page_title %}All Works — System Wide{% endblock %}

{% block content %}
<div class="card">

    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px">
    <div class="form-group" style="margin:0;min-width:160px">
      <label>Project Type</label>
      <select id="typeFilter" onchange="loadData()">
        <option value="All">All (Cash + Loan)</option>
        <option value="Cash">Cash only</option>
        <option value="Loan">Loan only</option>
      </select>
    </div>
    <div class="form-group" style="margin:0;min-width:160px">
      <label>Work Category</label>
      <select id="categoryFilter" onchange="loadData()">
        <option value="All">All</option>
        <option value="Installation">Power On+ Works</option>
        <option value="Outside">Outside Works</option>
      </select>
    </div>
    <button type="button" class="btn btn-primary" style="margin-top:20px" onclick="downloadExcel()">
      ↓ Download Excel
    </button>
    <span id="loadingTag" style="font-size:12px;color:var(--hint);margin-top:24px"></span>
  </div>

  <div id="kpiRow" style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px"></div>

  <div style="overflow-x:auto">
    <table style="width:100%;border-collapse:collapse;font-size:12px" id="worksTable">
      <thead>
        <tr>
          <th style="padding:6px 8px;text-align:left;background:var(--muted,#555);color:#fff;font-size:11px;white-space:nowrap">MNRE No.</th>
          <th style="padding:6px 8px;text-align:left;background:var(--muted,#555);color:#fff;font-size:11px;white-space:nowrap">Customer</th>
          <th style="padding:6px 8px;text-align:left;background:var(--muted,#555);color:#fff;font-size:11px;white-space:nowrap">Place</th>
          <th style="padding:6px 8px;text-align:center;background:var(--muted,#555);color:#fff;font-size:11px;white-space:nowrap">Type</th>
          <th style="padding:6px 8px;text-align:center;background:var(--muted,#555);color:#fff;font-size:11px;white-space:nowrap">Subtype</th>
                    <th style="padding:6px 8px;text-align:center;background:var(--muted,#555);color:#fff;font-size:11px;white-space:nowrap">Category</th>
          <th style="padding:6px 8px;text-align:center;background:var(--muted,#555);color:#fff;font-size:11px;white-space:nowrap">Status</th>
          <th style="padding:6px 8px;text-align:right;background:var(--muted,#555);color:#fff;font-size:11px;white-space:nowrap">Contract</th>
          <th style="padding:6px 8px;text-align:right;background:var(--muted,#555);color:#fff;font-size:11px;white-space:nowrap">Collected</th>
          <th style="padding:6px 8px;text-align:right;background:var(--muted,#555);color:#fff;font-size:11px;white-space:nowrap">Pending</th>
          <th style="padding:6px 8px;text-align:left;background:var(--muted,#555);color:#fff;font-size:11px;white-space:nowrap">Coordinator</th>
          <th style="padding:6px 8px;text-align:left;background:var(--muted,#555);color:#fff;font-size:11px;white-space:nowrap">Doc Staff</th>
          <th style="padding:6px 8px;text-align:center;background:var(--muted,#555);color:#fff;font-size:11px;white-space:nowrap">Created</th>
        </tr>
      </thead>
      <tbody id="worksBody">
        <tr><td colspan="12" style="text-align:center;padding:30px;color:var(--hint)">Loading…</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
function currentFilter() {
  return document.getElementById('typeFilter').value;
}

function downloadExcel() {
  window.location = `/admin/all_works/download?project_type=${currentFilter()}`;
}
function currentTypeFilter() {
  return document.getElementById('typeFilter').value;
}
function currentCategoryFilter() {
  return document.getElementById('categoryFilter').value;
}
function buildQS() {
  return `project_type=${currentTypeFilter()}&work_category=${currentCategoryFilter()}`;
}

function downloadExcel() {
  window.location = `/admin/all_works/download?${buildQS()}`;
}
function loadData() {
  document.getElementById('loadingTag').textContent = 'Loading…';
  fetch(`/admin/all_works/preview_data?${buildQS()}`)
    .then(r => r.json())
    .then(data => {
      renderKpis(data.kpis);
      renderTable(data.projects);
      document.getElementById('loadingTag').textContent = '';
    })
    .catch(() => {
      document.getElementById('loadingTag').textContent = 'Failed to load.';
    });
}

function renderKpis(kpis) {
  const row = document.getElementById('kpiRow');
  row.innerHTML = Object.entries(kpis).map(([k, v]) => `
    <div style="background:var(--surface,#f5f5f5);border-radius:6px;padding:10px 14px;min-width:90px">
      <div style="font-size:11px;color:var(--hint)">${k}</div>
      <div style="font-size:15px;font-weight:700;color:var(--text,#222)">${v}</div>
    </div>`).join('');
}

function renderTable(projects) {
  const td  = s => `<td style="padding:5px 8px;font-size:11px;border-bottom:1px solid var(--border)">${s ?? '—'}</td>`;
  const tdc = s => `<td style="padding:5px 8px;font-size:11px;border-bottom:1px solid var(--border);text-align:center">${s ?? '—'}</td>`;
  const tdr = s => `<td style="padding:5px 8px;font-size:11px;border-bottom:1px solid var(--border);text-align:right">${s ?? '—'}</td>`;

  const body = document.getElementById('worksBody');
  if (!projects.length) {
    body.innerHTML = '<tr><td colspan="12" style="text-align:center;padding:30px;color:var(--hint)">No projects found.</td></tr>';
    return;
  }

    body.innerHTML = projects.map((p, i) => {
    const bg = i % 2 === 0 ? 'var(--surface,#f9f9f9)' : '#fff';
    return `<tr style="background:${bg}">
      ${tdc(p.code)}${td(p.customer)}${td(p.place)}${tdc(p.type)}${tdc(p.subtype)}${tdc(p.work_category)}
      <td style="padding:5px 8px;font-size:11px;border-bottom:1px solid var(--border);text-align:center">
        <span style="padding:2px 6px;border-radius:10px;font-size:10px;background:${p.status_bg};color:${p.status_fg}">${p.status}</span>
      </td>
      ${tdr(p.contract)}${tdr(p.collected)}${tdr(p.pending)}${td(p.coordinator)}${td(p.doc_staff)}${tdc(p.created)}
    </tr>`;
  }).join('');
}

document.addEventListener('DOMContentLoaded', loadData);
</script>
{% endblock %}
